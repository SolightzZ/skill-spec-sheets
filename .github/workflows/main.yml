name: Validate and deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        # Security: pin by full commit SHA (mutable-tag supply-chain risk, see
        # security_best_practices_report.md F-05). Dependabot keeps it current.
        uses: actions/checkout@v7.0.1 # v7 -> 3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0 # v7 -> 949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22

      # index.js is only the loader; page modules and tools are checked too, and
      # js/core/init.js is not parsed by check-docs.cjs.
      - name: Check JavaScript syntax
        run: |
          for file in index.js $(git ls-files '*.js' '*.cjs'); do
            node --check "$file"
          done

      - name: Check generated pages
        run: node tools/build-pages.cjs --check

      # Upstream clones are absent in CI, so source-path checks are skipped with
      # a warning per repo. Run this locally with the clones for full coverage.
      - name: Validate documentation data
        run: node tools/check-docs.cjs

  # Site source: the repo ships pre-built pages (apps/), so deploy only needs
  # the site files themselves — not tools/, .github/, or the upstream-tracking
  # components of the artifact.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # GitHub recommends a dedicated "pages" group so deploys queue instead of
    # cancelling mid-publish.
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1 # v7 -> 3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0 # v7 -> 949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22

      - name: Stage site
        run: |
          mkdir -p _dist
          cp index.html index.css index.js _dist/
          cp -r apps js styles assets components _dist/

      # Perf (PERF.md): the repo ships hand-editable data sources, so the
      # deploy artifact is minified here, on the staged copy only. Working
      # tree files are never touched by this step.
      - name: Minify staged JavaScript
        run: node tools/minify-dist.cjs _dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0 # v5 -> fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1 # v5 -> 368f82528645a54fb793d4d04e342629a3f51346
